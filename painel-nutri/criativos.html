<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análise de Criativos</title>
<style>
:root{
  --bg:#0b0f1a; --panel:#121828; --panel2:#182036; --line:#243050; --text:#e8ecf6; --muted:#8a94ad;
  --accent:#ff3d8b; --accent2:#7c5cff; --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; --info:#38bdf8;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
a{color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:20px 16px 60px}
/* topo */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 12px var(--accent)}
.brand em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;color:transparent}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs a{padding:6px 16px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13px}
.tabs a.on{background:var(--accent);color:#fff}
.upd{margin-left:auto;color:var(--muted);font-size:12px}
/* períodos */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px}
.pill small{opacity:.7;font-weight:500;margin-left:4px}
.pill.on{border-color:var(--accent);color:#fff;box-shadow:0 0 0 1px var(--accent) inset,0 0 18px -6px var(--accent)}
/* seletor de escopo */
.scope{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:linear-gradient(90deg,rgba(255,61,139,.10),rgba(124,92,255,.08));border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:14px}
.scope .lbl{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.prods{display:flex;gap:6px;flex-wrap:wrap}
.prod{border:1px solid var(--line);background:var(--bg);color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:12px}
.prod.on{background:var(--accent);border-color:var(--accent);color:#fff}
.scope select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 10px;font:inherit;font-size:13px;flex:1 1 260px;min-width:0;max-width:520px}
/* cards resumo */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi{position:relative;overflow:hidden}
.kpi .tag{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--bg)}
.spark{display:block;width:100%;height:42px;margin-top:8px}
.spark-l{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:2px}
.kpi.dec{cursor:pointer}
.kpi.dec.on{outline:2px solid currentColor}
.decs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:-6px 0 18px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi.esc .v{color:var(--ok)} .kpi.des .v{color:var(--bad)} .kpi.tst .v{color:var(--warn)}
/* filtros */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:14px}
.filters input,.filters select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
.filters input{flex:1 1 220px;min-width:0}
.filters input:disabled{opacity:.5}
.count{color:var(--muted);font-size:12px;margin:0 0 12px 2px}
/* grade */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.thumb{position:relative;aspect-ratio:9/16;background:#000 center/cover no-repeat}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0,transparent 25%,transparent 60%,rgba(0,0,0,.85))}
.thumb .play{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:1;opacity:.85}
.thumb .play::before{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.badge{position:absolute;z-index:2;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.b-dec{top:8px;left:8px}
.b-st{top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;gap:5px;text-transform:none;font-weight:600}
.b-st i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.b-st.act i{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.escalar{background:var(--ok);color:#03210f} .desativar{background:var(--bad);color:#fff} .teste{background:var(--warn);color:#2a1a00}
.ovl{position:absolute;z-index:2;left:10px;right:10px;bottom:8px;display:flex;justify-content:space-between;align-items:flex-end;color:#fff}
.ovl b{font-size:22px;line-height:1}
.ovl span{font-size:11px;opacity:.85}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camp{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-6px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:auto}
.mini div{background:var(--bg);border-radius:8px;padding:5px 4px;text-align:center}
.mini small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}
.mini strong{font-size:13px;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(3,6,14,.78);backdrop-filter:blur(6px);display:none;z-index:50;padding:24px 16px;overflow:auto}
.modal.open{display:block}
.mbox{max-width:1180px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;display:grid;grid-template-columns:380px 1fr;overflow:hidden;position:relative}
.vid{background:#000;display:flex;align-items:flex-start;justify-content:center;min-height:640px}
.vid iframe{width:100%;height:100%;min-height:700px;border:0;background:#fff}
.vid .noig{color:var(--muted);padding:40px;text-align:center}
.info{padding:22px 24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.mh{display:flex;gap:12px;align-items:flex-start}
.mh h2{margin:0;font-size:20px;line-height:1.25;word-break:break-word}
.mh .sub{color:var(--muted);font-size:12px;margin-top:4px}
.mh .dec{position:static;font-size:12px;padding:5px 12px;white-space:nowrap}
.why{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;color:var(--muted);font-size:12px}
.close,.nav{position:absolute;top:12px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:16px;z-index:3}
.close{right:12px} .nav.prev{right:92px} .nav.next{right:52px}
h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mk{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.mk div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.mk small{display:block;color:var(--muted);font-size:11px}
.mk strong{font-size:17px;font-variant-numeric:tabular-nums}
.funnel{display:flex;flex-direction:column;gap:6px}
.fr{display:grid;grid-template-columns:150px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.fr .bar{height:10px;background:var(--bg);border-radius:99px;overflow:hidden}
.fr .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px}
.fr b{text-align:right;font-variant-numeric:tabular-nums}
.fr .hint{grid-column:1/-1;color:var(--muted);font-size:11px;margin-top:-4px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:12px}
.kv span{color:var(--muted)}
.kv code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:var(--text)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{padding:7px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;font-size:12px;font-weight:600;background:var(--bg)}
.links a:hover{border-color:var(--accent)}
.trans{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted);font-size:13px}
.trans b{color:var(--text)}
@media (max-width:860px){
  .mbox{grid-template-columns:1fr}
  .vid,.vid iframe{min-height:560px}
  .fr{grid-template-columns:110px 1fr 56px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot"></span>Análise de <em>Criativos</em></div>
    <nav class="tabs"><a href="index.html">Tabela</a><a href="criativos.html" class="on">Criativos</a></nav>
    <div class="upd" id="upd"></div>

  <div class="scope">

  <div class="decs" id="decs"></div>

  <div class="filters">
    <input id="q" placeholder="Buscar criativo, campanha ou conjunto…">
    <input id="qt" placeholder="Buscar na transcrição (sprint 2)" disabled>
    <select id="fstat">
      <option value="">Status: todos</option><option value="ACTIVE">Ativos</option><option value="PAUSED">Pausados</option>

    <select id="fdec">

    </select>
    <select id="sort">
      <option value="vendas">Ordenar: vendas</option><option value="roas">ROAS</option><option value="receita">Receita</option>
      <option value="spend">Investido</option><option value="cac">CPA (menor)</option><option value="ctr">CTR</option>
      <option value="ret_hook">Retenção hook</option><option value="ret_body">Retenção body</option>
    </select>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="mbox" id="mbox"></div>
</div>

// Série diária no período (mínimo de 7 dias, terminando no fim do período)
function series(){
  let [a, b] = D.bounds[period];
  const end = new Date(b+'T12:00:00'); let start = new Date(a+'T12:00:00');
  const minStart = new Date(end); minStart.setDate(minStart.getDate()-6);
  if (start > minStart) start = minStart;
  const days = []; for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) days.push(d.toISOString().slice(0,10));
  const idx = Object.fromEntries(days.map((d,i)=>[d,i]));
  const sp = days.map(()=>0), rc = days.map(()=>0), vd = days.map(()=>0);
  const ok = id => { const c = D.catalog[id]; return c && inScope(c[0], c[1]); };
  D.daily.spend.forEach(([d,id,v]) => { if (d in idx && ok(id)) sp[idx[d]] += v; });
  D.daily.sales.forEach(([d,id,v]) => { if (d in idx && ok(id)) { rc[idx[d]] += v; vd[idx[d]] += 1; } });
  const ro = days.map((_,i) => sp[i] ? rc[i]/sp[i] : 0);
  return {days, sp, rc, vd, ro};
}

function spark(vals, color, days, ref){
  const W = 200, H = 42, n = vals.length, max = Math.max(...vals, ref||0) || 1;
  const pts = vals.map((v,i) => [n>1 ? i*W/(n-1) : W/2, H-3-(v/max)*(H-8)]);
  const line = pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ');
  const gid = 'g'+Math.random().toString(36).slice(2,8);
  const refY = ref ? (H-3-(ref/max)*(H-8)).toFixed(1) : null;
  const f = d => d.slice(8,10)+'/'+d.slice(5,7);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${refY?`<line x1="0" x2="${W}" y1="${refY}" y2="${refY}" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`:''}
    <polygon points="0,${H} ${line} ${W},${H}" fill="url(#${gid})"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
  </svg><div class="spark-l"><span>${f(days[0])}</span><span>${f(days[days.length-1])}</span></div>`;
}

        <div><small>Cliques</small><strong>${num(r.clicks)}</strong></div>
        <div><small>Cliques no link</small><strong>${num(r.link_clicks)}</strong></div>
        <div><small>CTR</small><strong>${pc(r.ctr)}</strong></div>
        <div><small>CPC</small><strong>${brl(r.cpc)}</strong></div>
        <div><small>CPM</small><strong>${brl(r.cpm)}</strong></div>
      </div></section>

      <section><h3>Transcrição</h3>
        <div class="trans"><b>Sprint 2.</b> Aqui entra o texto completo do vídeo, separado em hook, body e CTA, com busca por padrão em todos os criativos.</div>
      </section>

      <section><h3>Identificação</h3><div class="kv">
        <span>Campanha</span><code>${esc(r.campaign)}</code>
        <span>Conjunto</span><code>${esc(r.adset)}</code>
        <span>ID do anúncio</span><code>${esc(r.id)}</code>
        <span>utm_content</span><code>${esc(r.name)}|${esc(r.id)}</code>
      </div>
      <div class="links" style="margin-top:12px">
        ${r.instagram?`<a href="${esc(r.instagram)}" target="_blank">Instagram ↗</a>`:''}
        ${r.preview?`<a href="${esc(r.preview)}" target="_blank">Prévia Facebook ↗</a>`:''}
        <a href="${gm}" target="_blank">Gerenciador de Anúncios ↗</a>
      </div></section>
    </div>`;
  $('#modal').classList.add('open'); document.body.style.overflow='hidden';
  $('#mbox .close').onclick = closeModal;
  $('#mbox .prev').onclick = () => step(-1);
  $('#mbox .next').onclick = () => step(1);
}
function step(d){ if(list.length) openModal((cur + d + list.length) % list.length); }
function closeModal(){ $('#modal').classList.remove('open'); document.body.style.overflow=''; cur=-1; }
$('#modal').onclick = e => { if (e.target.id==='modal') closeModal(); };
document.addEventListener('keydown', e => {
  if (cur<0) return;
  if (e.key==='Escape') closeModal(); else if (e.key==='ArrowRight') step(1); else if (e.key==='ArrowLeft') step(-1);
});
['#q','#fstat','#sort'].forEach(s => $(s).addEventListener('input', renderGrid));
$('#fdec').addEventListener('input', e => { decFilter = e.target.value; renderKpis(); renderGrid(); });
$('#scamp').addEventListener('input', e => { camp = e.target.value; render(); });

function render(){ renderScope(); renderPills(); renderKpis(); renderGrid(); }
$('#upd').textContent = 'Atualizado em ' + D.updated;
render();
</script>
</body>
