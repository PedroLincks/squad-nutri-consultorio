name: Refresh Painel Max

# Atualiza o painel de performance (https://painel-nutri.vercel.app) de hora em hora.
# Roda no GitHub (nuvem) — NÃO depende do Mac do Pedro estar ligado.
#
# Cron do GitHub Actions é UTC. Brasília = UTC-3.
# Janela desejada: 08h–22h BRT  ==  11:00–23:00 UTC + 00:00,01:00 UTC.
on:
  schedule:
    - cron: "0 0,1,11-23 * * *"   # 08h às 22h (horário de Brasília), de hora em hora
  workflow_dispatch: {}            # permite rodar manualmente pelo botão "Run workflow"

# Evita duas execuções simultâneas (uma agendada + uma manual)
concurrency:
  group: refresh-painel
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo   # timestamps e o "hoje" do painel no fuso do Brasil (runner é UTC)
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_ACCOUNT_ID: "168028315098298"
      GURU_API_TOKEN: ${{ secrets.GURU_API_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Meta — gasto/CTR por anúncio
        run: bash scripts/meta.sh build

      - name: Guru — venda real por UTM
        run: bash scripts/gateway.sh build

      - name: Gerar HTML e publicar na Vercel
        run: bash scripts/deploy-painel.sh
