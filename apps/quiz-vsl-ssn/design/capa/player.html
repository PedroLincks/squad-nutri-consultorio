<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mockup player</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #fff; padding: 0; }

  /* Canvas exportado como PNG (2x) */
  .canvas { width: 540px; height: 600px; padding: 18px; font-family: 'Montserrat', sans-serif; display: flex; }

  .player {
    position: relative; flex: 1; border-radius: 22px; overflow: hidden; background: #111;
    box-shadow: 0 22px 50px rgba(17,24,39,.28), 0 2px 6px rgba(17,24,39,.12);
  }

  /* Imagem com blur leve */
  .frame {
    position: absolute; inset: -12px;
    background: url(FRAME) 50% 35% / cover no-repeat;
    filter: blur(BLURpx) saturate(1.05);
    transform: scale(1.03);
  }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,.05) 30%, rgba(0,0,0,.1) 65%, rgba(0,0,0,.7) 100%); }

  /* Barra superior */
  .top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: 16px 18px; color: #fff; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: url(frame3.webp) 50% 22% / 200% no-repeat; border: 2px solid #fff; flex-shrink: 0; }
  .top-txt b { display: block; font-size: 13px; font-weight: 800; }
  .top-txt span { font-size: 11px; font-weight: 600; opacity: .85; }
  .badge { margin-left: auto; background: #dc2626; font-size: 10px; font-weight: 800; letter-spacing: .06em; padding: 6px 10px; border-radius: 999px; }

  /* Play central */
  .lock-wrap { position: absolute; left: 50%; top: PLAYY%; transform: translate(-50%, -50%); }
  .lock {
    width: 100px; height: 100px; border-radius: 50%; background: #dc2626;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 12px rgba(220,38,38,.28), 0 0 0 26px rgba(220,38,38,.12), 0 14px 32px rgba(0,0,0,.35);
  }
  .lock svg { width: 44px; height: 44px; margin-left: 6px; fill: #fff; }
  .lock-txt { background: rgba(0,0,0,.6); color: #fff; font-size: 14px; font-weight: 700; padding: 9px 16px; border-radius: 999px; backdrop-filter: blur(4px); }

  /* Controles */
  .controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 18px 16px; color: #fff; }
  .bar { height: 5px; border-radius: 99px; background: rgba(255,255,255,.3); margin-bottom: 12px; position: relative; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 2%; background: #dc2626; border-radius: 99px; }
  .bar i::after { content: ''; position: absolute; right: -6px; top: -4px; width: 13px; height: 13px; border-radius: 50%; background: #dc2626; }
  .row { display: flex; align-items: center; gap: 16px; font-size: 12px; font-weight: 700; }
  .row svg { width: 20px; height: 20px; fill: #fff; }
  .row .sp { margin-left: auto; }
  .hint { background: #dc2626; padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="player">
      <div class="frame"></div>
      <div class="shade"></div>

      <div class="top">
        <div class="avatar"></div>
        <div class="top-txt"><b>Letícia Cruz</b><span>Nutri de Consultório</span></div>
        <div class="badge">AULA GRATUITA</div>
      </div>

      <div class="lock-wrap">
        <div class="lock">
          <svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z" /></svg>
        </div>
      </div>

      <div class="controls">
        <div class="bar"><i></i></div>
        <div class="row">
          <svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" /></svg>
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z" /></svg>
          <span>00:00</span>
          <span class="hint">Toque para assistir</span>
          <span class="sp"></span>
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4zm11-5h5v5h-2V6h-3V4zM6 15v3h3v2H4v-5h2zm12 3v-3h2v5h-5v-2h3z" /></svg>
        </div>
      </div>
    </div>
  </div>
  <script>
    // ?f=frame1.webp&b=6 — troca imagem e intensidade do blur para comparar variações
    const q = new URLSearchParams(location.search)
    const css = document.querySelector('style')
    css.textContent = css.textContent.replace('FRAME', q.get('f') || 'frame1.webp').replace('BLUR', q.get('b') || '0').replace('PLAYY', q.get('y') || '50')
  </script>
</body>
</html>
